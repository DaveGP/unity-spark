<svg id="Feature brief – Spark Helper (A4)" xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect id="Background" x="0" y="0" width="1240" height="1754" fill="#0e0f13"/><defs><radialGradient id="brief-glow" cx=".9" cy="0" r=".75"><stop stop-color="#c4b5fd" stop-opacity=".09"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient></defs><rect id="Glow" x="0" y="0" width="1240" height="760" fill="url(#brief-glow)"/><g id="Header"><g id="Logo"><text id="Unity" x="72" y="100" font-family="Inter" font-size="22" font-weight="700" fill="#ededf2">Unity</text><text id="Spark" x="139.60000000000002" y="100" font-family="Inter" font-size="22" font-weight="500" fill="#c4b5fd">Spark</text></g><text id="Doc type" x="1168" y="100" font-family="Inter" font-size="10" font-weight="600" fill="#8d8e9a" text-anchor="end" letter-spacing="0.9">FEATURE BRIEF · ONBOARDING</text><text id="Eyebrow / Onboarding" x="72" y="178" font-family="Inter" font-size="10" font-weight="600" fill="#b9a8ff" letter-spacing="0.9">ONBOARDING</text><text id="Title" x="72" y="228" font-family="Inter" font-size="46" font-weight="600" fill="#ededf2">Spark Helper</text><text id="Subtitle" x="72" y="266" font-family="Inter" font-size="18" font-weight="400" fill="#c4c5cf"><tspan x="72" dy="0">Quick questions, asked while Spark builds, that teach it who each user is so every</tspan><tspan x="72" dy="27">suggestion fits them.</tspan></text></g><g id="Flow – where Spark Helper fits"><g id="Stage – First prompt"><rect id="Bar" x="72" y="346" width="186.32000000000002" height="44" rx="10" fill="#1a1b21" stroke="#30313a" stroke-width="1"/><text id="Label" x="88" y="373.5" font-family="Inter" font-size="13" font-weight="600" fill="#c4c5cf">First prompt</text></g><g id="Stage – First build"><rect id="Bar" x="280.24" y="346" width="471.28" height="44" rx="10" fill="#c4b5fd" fill-opacity="0.1" stroke="#b3a1fb" stroke-width="1"/><text id="Label" x="296.24" y="373.5" font-family="Inter" font-size="13" font-weight="600" fill="#b9a8ff">First build</text><text id="Duration" x="735.52" y="373.5" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a" text-anchor="end">median 8 min 50 s</text></g><g id="Stage – Play"><rect id="Bar" x="773.44" y="346" width="164.40000000000003" height="44" rx="10" fill="#1a1b21" stroke="#30313a" stroke-width="1"/><text id="Label" x="789.44" y="373.5" font-family="Inter" font-size="13" font-weight="600" fill="#c4c5cf">Play</text></g><g id="Stage – Next steps"><rect id="Bar" x="959.7600000000001" y="346" width="208.23999999999995" height="44" rx="10" fill="#1a1b21" stroke="#30313a" stroke-width="1"/><text id="Label" x="975.7600000000001" y="373.5" font-family="Inter" font-size="13" font-weight="600" fill="#c4c5cf">Next steps</text></g><path id="Bracket" d="M 282.24 408 v 8 H 749.52 v -8" fill="none" stroke="#7ad6a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle id="Question 1" cx="310.24" cy="440" r="9" fill="#7ad6a6" fill-opacity="0.14" stroke="#7ad6a6" stroke-width="1.2"/><text id="Mark" x="310.24" y="444" font-family="Inter" font-size="10.5" font-weight="700" fill="#7ad6a6" text-anchor="middle">?</text><circle id="Question 2" cx="413.06" cy="440" r="9" fill="#7ad6a6" fill-opacity="0.19" stroke="#7ad6a6" stroke-width="1.2"/><text id="Mark" x="413.06" y="444" font-family="Inter" font-size="10.5" font-weight="700" fill="#7ad6a6" text-anchor="middle">?</text><circle id="Question 3" cx="515.88" cy="440" r="9" fill="#7ad6a6" fill-opacity="0.24000000000000002" stroke="#7ad6a6" stroke-width="1.2"/><text id="Mark" x="515.88" y="444" font-family="Inter" font-size="10.5" font-weight="700" fill="#7ad6a6" text-anchor="middle">?</text><circle id="Question 4" cx="618.7" cy="440" r="9" fill="#7ad6a6" fill-opacity="0.29000000000000004" stroke="#7ad6a6" stroke-width="1.2"/><text id="Mark" x="618.7" y="444" font-family="Inter" font-size="10.5" font-weight="700" fill="#7ad6a6" text-anchor="middle">?</text><circle id="Question 5" cx="721.52" cy="440" r="9" fill="#7ad6a6" fill-opacity="0.34" stroke="#7ad6a6" stroke-width="1.2"/><text id="Mark" x="721.52" y="444" font-family="Inter" font-size="10.5" font-weight="700" fill="#7ad6a6" text-anchor="middle">?</text><text id="Caption" x="515.88" y="474" font-family="Inter" font-size="12.5" font-weight="400" fill="#7ad6a6" text-anchor="middle">Spark Helper asks one question at a time while the user waits</text></g><rect id="Divider" x="72" y="508" width="1096" height="1" fill="#24252d"/><g id="Brief"><g id="01 The problem"><text id="Number" x="72" y="559" font-family="Inter" font-size="11" font-weight="700" fill="#b9a8ff" letter-spacing="0.6">01</text><text id="Heading" x="102" y="560" font-family="Inter" font-size="20" font-weight="600" fill="#ededf2">The problem</text><text id="Body" x="72" y="593.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="72" dy="0">Unity Spark lets anyone make the game they have in their head. We can expect a wide</tspan><tspan x="72" dy="23">variety of users, from casual gamers to experienced developers. Unity Spark needs to</tspan><tspan x="72" dy="23">understand every user’s interests, understanding and communication style to provide</tspan><tspan x="72" dy="23">the best possible experience and keep them engaged.</tspan></text></g><g id="02 Why we think so"><text id="Number" x="72" y="718" font-family="Inter" font-size="11" font-weight="700" fill="#b9a8ff" letter-spacing="0.6">02</text><text id="Heading" x="102" y="719" font-family="Inter" font-size="20" font-weight="600" fill="#ededf2">Why we think so</text><circle cx="76" cy="749" r="2.8" fill="#c4b5fd"/><text id="Bullet" x="90" y="752.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="90" dy="0">The onboarding funnel shows 38% of users abandon their project during the initial</tspan><tspan x="90" dy="23">build (median 8 min 50 s), as there is nothing to keep them engaged.</tspan></text><circle cx="76" cy="807" r="2.8" fill="#c4b5fd"/><text id="Bullet" x="90" y="810.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="90" dy="0">User sessions show users with wildly different backgrounds and skill levels. Each</tspan><tspan x="90" dy="23">type of user needs a different level of support and prompting.</tspan></text><circle cx="76" cy="865" r="2.8" fill="#c4b5fd"/><text id="Bullet" x="90" y="868.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="90" dy="0">AI models increasingly use memory to tailor their responses, so users increasingly</tspan><tspan x="90" dy="23">expect personalisation.</tspan></text></g><g id="03 The feature"><text id="Number" x="72" y="947" font-family="Inter" font-size="11" font-weight="700" fill="#b9a8ff" letter-spacing="0.6">03</text><text id="Heading" x="102" y="948" font-family="Inter" font-size="20" font-weight="600" fill="#ededf2">The feature</text><text id="Body" x="72" y="981.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="72" dy="0">Spark Helper is a series of questions designed to learn about the user. It asks them</tspan><tspan x="72" dy="23">while the primary agent is building prototypes and making changes, keeping users</tspan><tspan x="72" dy="23">engaged during these waits while building up a profile that informs future decisions</tspan><tspan x="72" dy="23">across projects. Users can check and amend their profile at any time from their</tspan><tspan x="72" dy="23">account page.</tspan></text></g><g id="04 Risks"><text id="Number" x="72" y="1129" font-family="Inter" font-size="11" font-weight="700" fill="#b9a8ff" letter-spacing="0.6">04</text><text id="Heading" x="102" y="1130" font-family="Inter" font-size="20" font-weight="600" fill="#ededf2">Risks</text><text id="Body" x="72" y="1163.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="72" dy="0">Some users may find the questions annoying, so they can dismiss Spark Helper and turn</tspan><tspan x="72" dy="23">it back on later from their profile.</tspan></text></g><g id="05 Roadmap"><text id="Number" x="72" y="1242" font-family="Inter" font-size="11" font-weight="700" fill="#b9a8ff" letter-spacing="0.6">05</text><text id="Heading" x="102" y="1243" font-family="Inter" font-size="20" font-weight="600" fill="#ededf2">Roadmap</text><g id="First version"><rect id="Rule" x="72" y="1262" width="306" height="2" rx="1" fill="#c4b5fd"/><text id="Label" x="72" y="1284" font-family="Inter" font-size="10.5" font-weight="600" fill="#c4b5fd" letter-spacing="0.8">FIRST VERSION</text><text id="Body" x="72" y="1306" font-family="Inter" font-size="14" font-weight="400" fill="#c4c5cf"><tspan x="72" dy="0">Introduce the questions, store the answers</tspan><tspan x="72" dy="22">for each user and use that data to inform</tspan><tspan x="72" dy="22">recommendations.</tspan></text></g><g id="Later"><rect id="Rule" x="406" y="1262" width="306" height="2" rx="1" fill="#8d8e9a"/><text id="Label" x="406" y="1284" font-family="Inter" font-size="10.5" font-weight="600" fill="#8d8e9a" letter-spacing="0.8">LATER</text><text id="Body" x="406" y="1306" font-family="Inter" font-size="14" font-weight="400" fill="#c4c5cf"><tspan x="406" dy="0">The AI team uses the profile to further</tspan><tspan x="406" dy="22">improve the quality of responses and</tspan><tspan x="406" dy="22">refine the experience for each individual.</tspan></text></g></g><g id="06 How we’ll know it worked"><text id="Number" x="72" y="1405" font-family="Inter" font-size="11" font-weight="700" fill="#b9a8ff" letter-spacing="0.6">06</text><text id="Heading" x="102" y="1406" font-family="Inter" font-size="20" font-weight="600" fill="#ededf2">How we’ll know it worked</text><text id="Body" x="72" y="1439.5" font-family="Inter" font-size="14.5" font-weight="400" fill="#c4c5cf"><tspan x="72" dy="0">More people sticking around long enough to get something playable, and through each</tspan><tspan x="72" dy="23">step of the funnel after that. We’d also expect the end result to be better suited to</tspan><tspan x="72" dy="23">each user’s ideas and preferences.</tspan></text><g id="Metric – Engagement"><rect id="Pill" x="72" y="1508" width="99" height="28" rx="14" fill="#c4b5fd" fill-opacity="0.1" stroke="#c4b5fd" stroke-width="1"/><text id="Label" x="121.5" y="1526.5" font-family="Inter" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">Engagement</text></g><g id="Metric – Retention"><rect id="Pill" x="179" y="1508" width="91" height="28" rx="14" fill="#c4b5fd" fill-opacity="0.1" stroke="#c4b5fd" stroke-width="1"/><text id="Label" x="224.5" y="1526.5" font-family="Inter" font-size="12" font-weight="600" fill="#c4b5fd" text-anchor="middle">Retention</text></g><g id="Metric – Builds reaching playable"><rect id="Pill" x="278" y="1508" width="200" height="28" rx="14" fill="#7ad6a6" fill-opacity="0.1" stroke="#7ad6a6" stroke-width="1"/><text id="Label" x="378" y="1526.5" font-family="Inter" font-size="12" font-weight="600" fill="#7ad6a6" text-anchor="middle">Builds reaching playable</text></g></g></g><g id="Visuals"><g id="Stat – build abandonment"><rect id="Card" x="768" y="544" width="400" height="168" rx="16" fill="#1a1b21" stroke="#30313a" stroke-width="1"/><text id="Number" x="796" y="636" font-family="Inter" font-size="64" font-weight="600" fill="#c4b5fd">38%</text><text id="Caption" x="796" y="668" font-family="Inter" font-size="14" font-weight="400" fill="#c4c5cf"><tspan x="796" dy="0">of new users abandon their project during the</tspan><tspan x="796" dy="21">first build</tspan></text></g><g id="Sketch – one question at a time"><rect id="Card" x="768" y="736" width="400" height="247" rx="16" fill="#7ad6a6" fill-opacity="0.04" stroke="#7ad6a6" stroke-width="1" opacity="0.45"/><circle cx="795" cy="767" r="5" fill="#7ad6a6"/><text id="Name" x="806" y="771" font-family="Inter" font-size="12" font-weight="600" fill="#7ad6a6">Spark Helper</text><g id="Badge"><rect id="Pill" x="902" y="757" width="101" height="20" rx="10" fill="#7ad6a6" fill-opacity="0.08" stroke="#7ad6a6" stroke-width="1"/><text id="Label" x="952.5" y="771" font-family="Inter" font-size="10.5" font-weight="400" fill="#7ad6a6" text-anchor="middle">While you wait</text></g><text id="Progress" x="790" y="796" font-family="Inter" font-size="10" font-weight="600" fill="#62636e" letter-spacing="0.6">GOALS · PROFILE 5 OF 30</text><text id="Question" x="790" y="821" font-family="Inter" font-size="15" font-weight="600" fill="#ededf2"><tspan x="790" dy="0">What would you like to get out of Spark?</tspan></text><g id="Chip – Have fun making something"><rect id="Chip" x="790" y="839" width="191" height="28" rx="6" fill="#202128" stroke="#30313a" stroke-width="1"/><text id="Label" x="885.5" y="857.5" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf" text-anchor="middle">Have fun making something</text></g><g id="Chip – Learn how games are made"><rect id="Chip" x="790" y="875" width="184" height="28" rx="6" fill="#c4b5fd" fill-opacity="0.1" stroke="#b3a1fb" stroke-width="1"/><text id="Label" x="882" y="893.5" font-family="Inter" font-size="12" font-weight="400" fill="#c4b5fd" text-anchor="middle">Learn how games are made</text></g><g id="Chip – Prototype an idea"><rect id="Chip" x="982" y="875" width="137" height="28" rx="6" fill="#202128" stroke="#30313a" stroke-width="1"/><text id="Label" x="1050.5" y="893.5" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf" text-anchor="middle">Prototype an idea</text></g><g id="Chip – Make something to share"><rect id="Chip" x="790" y="911" width="178" height="28" rx="6" fill="#202128" stroke="#30313a" stroke-width="1"/><text id="Label" x="879" y="929.5" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf" text-anchor="middle">Make something to share</text></g><text id="Action – Skip" x="790" y="961" font-family="Inter" font-size="11.5" font-weight="400" fill="#8d8e9a">Skip</text><text id="Action – Not now" x="833.5852" y="961" font-family="Inter" font-size="11.5" font-weight="400" fill="#8d8e9a">Not now</text><text id="Action – Don’t ask again this session" x="896.3593" y="961" font-family="Inter" font-size="11.5" font-weight="400" fill="#8d8e9a">Don’t ask again this session</text></g><text id="Sketch caption" x="772" y="1009" font-family="Inter" font-size="11.5" font-weight="400" fill="#8d8e9a">Asked during builds and changes. Users can skip, pause or dismiss.</text><text id="Eyebrow / What it learns" x="768" y="1043" font-family="Inter" font-size="10" font-weight="600" fill="#8d8e9a" letter-spacing="0.9">WHAT IT LEARNS</text><g id="Topic – Goals and motivations"><text id="Topic" x="768" y="1083" font-family="Inter" font-size="13.5" font-weight="600" fill="#ededf2">Goals and motivations</text><text id="Why" x="768" y="1101" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a">To guide them to what they want to achieve</text></g><g id="Topic – Experience and confidence"><rect id="Rule" x="768" y="1113" width="400" height="1" fill="#24252d"/><text id="Topic" x="768" y="1135" font-family="Inter" font-size="13.5" font-weight="600" fill="#ededf2">Experience and confidence</text><text id="Why" x="768" y="1153" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a">To talk to them on their level</text></g><g id="Topic – Taste in games"><rect id="Rule" x="768" y="1165" width="400" height="1" fill="#24252d"/><text id="Topic" x="768" y="1187" font-family="Inter" font-size="13.5" font-weight="600" fill="#ededf2">Taste in games</text><text id="Why" x="768" y="1205" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a">To suggest things they’ll enjoy</text></g><g id="Topic – Look and style"><rect id="Rule" x="768" y="1217" width="400" height="1" fill="#24252d"/><text id="Topic" x="768" y="1239" font-family="Inter" font-size="13.5" font-weight="600" fill="#ededf2">Look and style</text><text id="Why" x="768" y="1257" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a">To guide asset pack recommendations</text></g><g id="Topic – Practical context"><rect id="Rule" x="768" y="1269" width="400" height="1" fill="#24252d"/><text id="Topic" x="768" y="1291" font-family="Inter" font-size="13.5" font-weight="600" fill="#ededf2">Practical context</text><text id="Why" x="768" y="1309" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a">To set the scope of suggestions and nudges</text></g><g id="Topic – Feedback style"><rect id="Rule" x="768" y="1321" width="400" height="1" fill="#24252d"/><text id="Topic" x="768" y="1343" font-family="Inter" font-size="13.5" font-weight="600" fill="#ededf2">Feedback style</text><text id="Why" x="768" y="1361" font-family="Inter" font-size="12" font-weight="400" fill="#8d8e9a">To match how Spark communicates</text></g></g><g id="Footer"><rect id="Divider" x="72" y="1634" width="1096" height="1" fill="#24252d"/><g id="Link – Prototype"><text id="Kind" x="72" y="1668" font-family="Inter" font-size="10" font-weight="600" fill="#b9a8ff" letter-spacing="0.8">PROTOTYPE</text><text id="Where" x="72" y="1688" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf">davegp.github.io/unity-spark</text></g><g id="Link – Figma"><text id="Kind" x="346" y="1668" font-family="Inter" font-size="10" font-weight="600" fill="#b9a8ff" letter-spacing="0.8">FIGMA</text><text id="Where" x="346" y="1688" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf">Unity Spark – Onboarding walkthrough</text></g><g id="Link – FigJam"><text id="Kind" x="620" y="1668" font-family="Inter" font-size="10" font-weight="600" fill="#b9a8ff" letter-spacing="0.8">FIGJAM</text><text id="Where" x="620" y="1688" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf">Onboarding flow (Testing board)</text></g><g id="Link – Code"><text id="Kind" x="894" y="1668" font-family="Inter" font-size="10" font-weight="600" fill="#b9a8ff" letter-spacing="0.8">CODE</text><text id="Where" x="894" y="1688" font-family="Inter" font-size="12" font-weight="400" fill="#c4c5cf">github.com/DaveGP/unity-spark</text></g><text id="Footer" x="72" y="1720" font-family="Inter" font-size="11" font-weight="400" fill="#62636e">Unity Spark · Spark Helper feature brief</text><text id="Author" x="1168" y="1720" font-family="Inter" font-size="11" font-weight="400" fill="#62636e" text-anchor="end">David Pearson · 26 November 2026</text></g></svg>